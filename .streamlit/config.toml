# 看板的 Streamlit 配置。放在仓库根而不是 dashboard/ 下：
# Streamlit 只按当前工作目录找配置，而 Streamlit Community Cloud 也从仓库根读它。
# 因此规范启动命令是在仓库根执行 .venv/bin/streamlit run dashboard/app.py。
# 数据路径一律由 dashboard/lib/paths.py 从 __file__ 解析，从别的目录启动只会丢主题、
# 不会读错数据。
#
# **界面的全部外观都在这份文件里，代码不注入任何 CSS。** 这是 Streamlit 官方设计
# 规范的做法（仓库内 design.md：「Do not use custom CSS to polish an app unless the
# user explicitly asks for it」）：原生主题跨元素一致，且不会随 Streamlit 内部
# class 名变化而失效。
#
# 视觉语言＝清爽的学术版式：纸白底、墨黑衬线（西文 serif / 中文宋体）、发丝横线、
# 小圆角、干净透亮的蓝红绿数据色。配色与 dashboard/lib/theme.py 的令牌必须一致——
# 图表外观由那边的 Altair 主题负责，这里的两个 chart*Colors 是同一套色给原生图表用。
# 两处对不上，页面与图会分裂成两套观感。tools/check_palette.py 会拿这份文件与
# 令牌对账，改一处就得改另一处。

[theme]
# 深色＝深夜纸：深海军蓝底、冷白字。整套看板只出这一档——浏览器系统主题切到
# 浅色时页面仍是深蓝，图表主题由 lib/theme.py 的 base_mode() 跟着钉死，不翻面。
base = "dark"
backgroundColor = "#0A1120"            # 深海蓝黑
secondaryBackgroundColor = "#101A2C"   # 卡片与图底，比页底亮一档
textColor = "#D6DEEB"                  # 冷白正文（不用纯白，长文不刺眼）
linkColor = "#8FB9EA"                  # 提亮的学院蓝
borderColor = "#22314C"                # 深蓝发丝线
dataframeHeaderBackgroundColor = "#16233A"
# 控件强调用同族板蓝的提亮版：主按钮、焦点环同一支色。
primaryColor = "#4C8DD6"
# 小圆角：卡片与按钮柔和分节，但不成药丸。
baseRadius = "medium"
buttonRadius = "medium"
showSidebarBorder = true
# 字号：底 15px 比默认的 16px 紧一档，适合读数密集的页面；
# 标题按 h1–h6 递减，期刊版式里标题不响，靠字重而不是字号分节。
baseFontSize = 15
headingFontSizes = ["1.8rem", "1.4rem", "1.18rem", "1.06rem", "0.98rem", "0.92rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
# 衬线栈不拉 Google Fonts：本机/云端有哪支用哪支，中文回落宋体（Songti SC /
# SimSun），不引入第三方请求。Georgia 与 Times 是 macOS/Windows 的保底。
font = '"Source Serif 4", "Source Serif Pro", "Charter", "Iowan Old Style", Georgia, "Times New Roman", "Songti SC", "STSong", "SimSun", serif'
headingFont = '"Source Serif 4", "Source Serif Pro", "Charter", "Iowan Old Style", Georgia, "Times New Roman", "Songti SC", "STSong", "SimSun", serif'
# 图表色＝lib/theme.py 的 SERIES_LIGHT 与 BLUE_RAMP。原生图表（st.line_chart 等）
# 走这两个键，Altair 图走 lib/theme.py 注册的主题，两者同色。
# 连续色阶**必须正好十个**，多一个少一个 Streamlit 会整组弃用。
chartCategoricalColors = [
  "#4784c2", "#ca5553", "#b18f2c", "#039e93",
  "#c57127", "#8c77c4", "#599c4f", "#ca7392",
]
chartSequentialColors = [
  "#28476d", "#2d4f77", "#335881", "#3a628c", "#4a78a3",
  "#6393bd", "#74a2ca", "#87b2d6", "#9cc2e3", "#b4d9f8",
]

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "full"
# 关掉右上角的 Deploy 按钮与开发者菜单。这是原生开关，不用 CSS 去藏元素。
# 交付物是内部只读看板，既不该让读者误点「部署」，也不需要开发者菜单。
toolbarMode = "minimal"
